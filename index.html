<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태수의 고양이 보관함</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        
        /* 갤러리 그리드 설정 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 카드 디자인 */
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }

        /* 이미지 설정 */
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover; /* 이미지가 찌그러지지 않게 꽉 채움 */
            display: block;
        }

        /* 다운로드 버튼 스타일 */
        .info { padding: 15px; }
        .download-btn {
            display: inline-block;
            background-color: #ff9900;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>

    <h1>🐱 고양이 사진 다운로드 센터</h1>
    <p>원하는 사진을 클릭해서 저장하세요!</p>

    <div class="gallery">
